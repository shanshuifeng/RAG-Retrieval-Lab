# ══════════════════════════════════════════════════
#  E1 · 基线对比：BM25 vs 稠密检索
# ══════════════════════════════════════════════════
#  研究问题：Q1 - 稠密向量检索比 BM25 好多少？
#  ⭐ 这是第一个实验，用于验证评测脚本正确性
#     必须先跑通，且与文献对照无误后再往下做
# ══════════════════════════════════════════════════

experiment:
  id: E1
  name: "基线对比 BM25 vs 稠密检索"
  description: "建立检索基线，验证评测代码正确性"

# ⭐ 数据配置 —— 语料库规模必须记录，否则结果无法对比
data:
  corpus_size: 100000          # 10 万段落（阶段2）
  # corpus_size: 10000         # 先用 1 万跑通（阶段1）
  # corpus_size: 1000000      # 100 万（阶段3）
  dev_ratio: 0.1               # 从 train 切 10% 作为 dev
  chunking: "native"           # E1 用原始 passage，不切分

# ────────── 检索配置 ──────────
retrieval:
  bm25:
    enabled: true
    k1: 1.5                    # ⭐ 词频饱和参数
    b: 0.75                    # ⭐ 长度归一化参数
    tokenizer: "jieba"

  dense:
    enabled: true

# ⭐ 嵌入模型对比（这是 E1 的第二个变量）
dense_models:
  - name: "BAAI/bge-small-zh-v1.5"
    batch_size: 64
    dim: 512
  - name: "BAAI/bge-base-zh-v1.5"
    batch_size: 32
    dim: 768
  # - name: "shibing624/text2vec-base-chinese"
  #   batch_size: 32

# E1 不做融合
fusion:
  enabled: false

# E1 不做重排序
rerank:
  enabled: false

# ────────── 评测配置 ──────────
eval:
  ks: [1, 5, 10, 20, 100]      # ⭐ 固定 K 值，所有方法一致
  metrics: ["recall", "mrr", "ndcg"]
  # ⚠️ 无相关标注的 query 处理方式
  skip_empty_relevant: true    # 过滤并在报告中记录数量

# ────────── 运行配置 ──────────
runtime:
  seed: 42
  device: "auto"               # auto / cuda / cpu
  num_workers: 4

# ══════════════════════════════════════════════════
#  ⭐ E1 的预期与检查点
# ══════════════════════════════════════════════════
#  1. BM25 应先跑出与文献【同量级】的数字
#     ⚠️ 对不上 → 检查分词、评测代码，不要继续
#  2. BM25 调参：k1 ∈ {0.9,1.2,1.5,2.0}，b ∈ {0.3,0.5,0.75,0.9}
#  3. 记录各组【延迟】和【内存】用于成本对比
# ══════════════════════════════════════════════════
